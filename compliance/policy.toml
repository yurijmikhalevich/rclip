hf-xet = ["1.5.2"]
httpcore = ["1.0.9"]
httpx = ["0.28.1"]
huggingface-hub = ["1.26.0"]
idna = ["3.18"]
mpmath = ["1.3.0"]
numpy = ["2.1.3"]
onnxruntime = ["1.28.0"]
