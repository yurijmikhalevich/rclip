schema_version = 1

prohibited_python_packages = ["pi-heif"]

# These distributions are supplied by the application itself or by the target
# Python environment rather than by rclip's locked runtime dependency closure.
# Keeping the exceptions explicit prevents a dependency from silently accepting
# arbitrary versions.
unversioned_python_packages = ["pip", "rclip", "setuptools", "wheel"]

# Build tools must not be present in self-contained runtime artifacts. pip,
# setuptools and wheel remain allowed because some virtualenv distributors
# install them as ordinary, replaceable Python packages.
prohibited_runtime_files = ["uv", "uvx"]

# Package names are normalized according to Python packaging rules. This table,
# together with unversioned_python_packages, is the complete allowlist. Any
# change here is a dependency policy change.
[allowed_python_versions]
anyio = ["4.14.2"]
attrs = ["26.1.0"]
cattrs = ["26.1.0"]
certifi = ["2026.7.22"]
charset-normalizer = ["3.4.9"]
click = ["8.4.2"]
colorama = ["0.4.6"]
coremltools = ["9.0"]
filelock = ["3.32.2"]
flatbuffers = ["25.12.19"]
fsspec = ["2026.7.0"]
ftfy = ["6.3.1"]
h11 = ["0.16.0"]
hf-xet = ["1.5.2"]
httpcore = ["1.0.9"]
httpx = ["0.28.1"]
huggingface-hub = ["1.26.0"]
idna = ["3.18"]
mpmath = ["1.3.0"]
numpy = ["2.1.3"]
onnxruntime = ["1.28.0"]
packaging = ["26.2"]
pillow = ["12.3.0"]
protobuf = ["7.35.1"]
pyaml = ["26.7.0"]
pyyaml = ["6.0.3"]
rawpy = ["0.26.1"]
regex = ["2026.4.4"]
requests = ["2.34.2"]
sympy = ["1.14.0"]
tqdm = ["4.70.0"]
typing-extensions = ["4.16.0"]
urllib3 = ["2.7.0"]
wcwidth = ["0.8.2"]

[codecs.av1]
allowed = true
required_notice = "AOM-PATENT-LICENSE-1.0.txt"
required_sha256 = "bd05b38492255b08e2f7b16a0755548e969a76d6ff8a1bd4919a5e0312f6f00e"

[[codecs.av1.native_components]]
name = "libavif"
version = "1.4.2"
path_markers = ["libavif", "_avif"]
binary_markers = ["avifDecoder"]

[[codecs.av1.native_components]]
name = "libaom"
version = "3.14.1"
binary_markers = ["aom_codec"]

[[codecs.av1.native_components]]
name = "dav1d"
version = "1.5.3-0-gb546257"
binary_markers = ["dav1d"]

[codecs.dng]
allowed = true
required_notice = "ADOBE-DNG-PATENT-LICENSE.txt"
required_text = "This product includes DNG technology under license by Adobe."
required_sha256 = "2314c8d717942f3a6a5745633fb60904309c16722696197d456847898e8966e8"

[[codecs.dng.native_components]]
name = "libraw"
version = "0.22.0"
path_markers = ["libraw", "raw_r", "_rawpy"]

[codecs.webp]
allowed = true
required_notice = "WEBP-PATENTS.txt"
required_sha256 = "8ba8ee940cc54a549846b19069996f8bcaa87d28a5a5c4cb0f3f959bde27737b"

[[codecs.webp.native_components]]
name = "libwebp"
version = "1.6.0"
path_markers = ["libwebp", "_webp"]
binary_markers = ["WebPDecode"]

[codecs.hevc]
allowed = false
forbidden_filename_patterns = ["libde265", "libx265", "x265.dll"]
forbidden_package_patterns = ["libde265", "libx265", "x265"]
forbidden_binary_markers = [
  "x265_encoder_open",
  "de265_decode",
]

[copyleft.libraw]
license = "LGPL-2.1-or-later"
must_be_shared = true
source_component = "rawpy"
