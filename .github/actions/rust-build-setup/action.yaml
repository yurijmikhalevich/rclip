name: Set up the Rust build
description: Installs what compiling rclip needs besides the Rust toolchain and restores the build cache

runs:
  using: composite
  steps:
    - name: Install NASM for libjpeg-turbo's SIMD code
      if: runner.os != 'macOS'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          choco install nasm --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
        fi
    - uses: ./.github/actions/onnxruntime
      if: runner.os == 'Linux'
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
