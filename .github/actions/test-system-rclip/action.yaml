name: Test system rclip
description: Runs the end-to-end tests against the rclip installed system-wide

runs:
  using: composite
  steps:
    - name: Print commit that we are going to run the tests from
      run: git rev-parse HEAD
      shell: bash
    - uses: ./.github/actions/rust-build-setup
    - name: Build the end-to-end tests
      run: cargo test --release --locked --test e2e --no-run
      shell: bash
    - name: Print tested rclip version
      run: |
        which rclip
        rclip --version
      # on Windows, we set the latest PATH to ensure that the action can find
      # system rclip
      # on other OSes, we pass -ieo pipefail to bash to ensure it reads the .bashrc
      shell: ${{ runner.os != 'Windows' && 'bash -ieo pipefail {0}' || 'powershell -NoLogo -NonInteractive -ExecutionPolicy RemoteSigned -Command "$env:Path = [Environment]::GetEnvironmentVariable(''Path'', ''Machine'') + '';'' + [Environment]::GetEnvironmentVariable(''Path'', ''User'') + '';'' + $env:Path; & {0}"' }}
    - run: cargo test --release --locked --test e2e
      env:
        RCLIP_TEST_RUN_SYSTEM_RCLIP: 'true'
      shell: ${{ runner.os != 'Windows' && 'bash -ieo pipefail {0}' || 'powershell -NoLogo -NonInteractive -ExecutionPolicy RemoteSigned -Command "$env:Path = [Environment]::GetEnvironmentVariable(''Path'', ''Machine'') + '';'' + [Environment]::GetEnvironmentVariable(''Path'', ''User'') + '';'' + $env:Path; & {0}"' }}
