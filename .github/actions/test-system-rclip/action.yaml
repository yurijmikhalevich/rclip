name: Test system rclip
description: Runs e2e tests on the rclip installed system-wide

inputs:
  python:
    description: 'Python version to use'
    required: false
    default: '3.11'
  force-bash:
    description: 'Force using bash instead of PowerShell on Windows'
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: Record system rclip executable and PATH
      if: runner.os != 'Windows'
      run: |
        executable=$(type -P rclip)
        echo "Testing $executable"
        echo "RCLIP_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
        echo "RCLIP_TEST_SYSTEM_PATH=$PATH" >> "$GITHUB_ENV"
        "$executable" --version
      # Read .bashrc so Homebrew-installed rclip is on PATH.
      shell: bash -ieo pipefail {0}
    - name: Record system rclip executable and PATH
      if: runner.os == 'Windows'
      run: |
        $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
        $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
        $env:Path = "$machinePath;$userPath;$env:Path"
        $executable = (Get-Command rclip -CommandType Application -ErrorAction Stop).Source
        Write-Host "Testing $executable"
        "RCLIP_TEST_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RCLIP_TEST_SYSTEM_PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $executable --version
      shell: powershell
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python }}
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
    - name: Print commit that we are going to run the tests from
      run: git rev-parse HEAD
      shell: bash
    - name: Install dev dependencies required to run e2e tests
      run: uv sync --locked --only-dev --no-install-project
      shell: bash
    - run: make test-system-rclip
      shell: ${{ (runner.os != 'Windows' || inputs.force-bash == 'true') && 'bash -ieo pipefail {0}' || 'powershell -NoLogo -NonInteractive -ExecutionPolicy RemoteSigned -Command "$env:Path = [Environment]::GetEnvironmentVariable(''Path'', ''Machine'') + '';'' + [Environment]::GetEnvironmentVariable(''Path'', ''User'') + '';'' + $env:Path; & {0}"' }}
