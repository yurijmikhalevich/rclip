name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      pypi:
        description: Build and test PyPI artifacts
        type: boolean
        default: true
      snap:
        description: Build and test Snap artifacts
        type: boolean
        default: true
      appimage:
        description: Build and test the AppImage
        type: boolean
        default: true
      windows:
        description: Build and test the Windows MSI
        type: boolean
        default: true
      sign_windows:
        description: Sign the Windows MSI (only used when Windows is selected)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  parse_tag:
    runs-on: ubuntu-22.04
    outputs:
      is_stable_version: ${{ steps.parse.outputs.is_stable_version }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-python@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.11'
      - id: parse
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            is_stable_version=$([[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo true || echo false)
          else
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            is_stable_version=false
          fi

          echo "is_stable_version=$is_stable_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pypi-build:
    needs: lint
    if: github.event_name == 'push' || inputs.pypi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: pypi
          path: dist/*
          if-no-files-found: error

  pypi-test:
    needs: pypi-build
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - uses: actions/download-artifact@v8
        with:
          name: pypi
          path: dist/
      - run: pip install dist/rclip-*.whl
        shell: bash
      - uses: ./.github/actions/test-system-rclip
        with:
          python: ${{ matrix.python }}
          force-bash: true

  pypi-release:
    needs: pypi-test
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  brew:
    # the Formula references the rclip package published to PyPI
    needs: [parse_tag, pypi-release]
    if: github.event_name == 'push' && needs.parse_tag.outputs.is_stable_version == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Setup git
        run: |
          git config --global user.email "zhibot.gh@gmail.com"
          git config --global user.name "Zhi Bot"
      - run: make release-brew
        env:
          GITHUB_TOKEN: ${{ secrets.ZHIBOT_GITHUB_TOKEN }}

  snap-build:
    needs: lint
    if: github.event_name == 'push' || inputs.snap
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: canonical/setup-lxd@main
      - run: sudo snap install snapcraft --classic
      - run: snapcraft --use-lxd --build-for ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: rclip_*.snap
          if-no-files-found: error

  snap-test:
    needs: snap-build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: snap-${{ matrix.arch }}
      - run: sudo snap install rclip_*_${{ matrix.arch }}.snap --dangerous
      - uses: ./.github/actions/test-system-rclip

  snap-release:
    needs: [snap-test, parse_tag]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - run: sudo snap install snapcraft --classic
      - uses: actions/download-artifact@v8
        with:
          pattern: snap-*
          merge-multiple: true
      - name: Upload snaps to the beta channel
        run: |
          for snap in *.snap; do
            snapcraft upload --release=beta "$snap"
          done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
      - name: Promote snaps to the stable channel
        if: needs.parse_tag.outputs.is_stable_version == 'true'
        run: snapcraft promote --from-channel=beta --to-channel=stable --yes rclip
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}

  appimage-build:
    needs: [lint, parse_tag]
    if: github.event_name == 'push' || inputs.appimage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y fuse
      - name: Install appimage-builder
        run: |
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder
      - name: Install appimagetool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APP_VERSION: ${{ needs.parse_tag.outputs.version }}
        run: bash ./release-utils/appimage/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: rclip-*.AppImage
          if-no-files-found: error

  appimage-test:
    needs: appimage-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y fuse
      - uses: actions/download-artifact@v8
        with:
          name: appimage
      - name: Install AppImage
        run: |
          chmod +x rclip-*.AppImage
          sudo mv rclip-*.AppImage /usr/local/bin/rclip
      - uses: ./.github/actions/test-system-rclip

  windows-build:
    needs: [lint, parse_tag]
    if: >-
      (github.event_name == 'push' && needs.parse_tag.outputs.is_stable_version == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - run: make build-windows
      - name: Install Advinst
        uses: caphyon/advinst-github-action@main
        with:
          advinst-version: '23.5'
          advinst-enable-automation: 'true'
      - run: |
          & ./release-utils/windows/build-msi.ps1 "${{ needs.parse_tag.outputs.version }}"
          mv build-msi/rclip-SetupFiles/rclip.msi build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi
      - name: Stage unsigned MSI
        if: github.event_name == 'workflow_dispatch' && !inputs.sign_windows
        run: |
          mkdir artifacts
          mv build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi artifacts/
      - name: Sign MSI
        if: github.event_name == 'push' || inputs.sign_windows
        run: |
          mkdir artifacts
          Invoke-WebRequest -URI https://d1smxttentwwqu.cloudfront.net/wp-content/uploads/2023/11/CodeSignTool-v1.2.7-windows.zip -OutFile CodeSignTool.zip
          if ( ( Get-FileHash -Algorithm SHA256 CodeSignTool.zip ).Hash -ne 'AC9CDBFF6D482DBC1107ABC8789570F57ECF85773332BBA466CB3E00CE0BB841' ) { throw 'hash does not match' }
          Expand-Archive -Path CodeSignTool.zip -DestinationPath .
          cd CodeSignTool-v1.2.7-windows
          & ./CodeSignTool.bat sign -input_file_path="${env:GITHUB_WORKSPACE}/build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi" -username=${{ secrets.WINDOWS_SIGNING_USERNAME }} -credential_id='${{ secrets.WINDOWS_SIGNING_CREDENTIAL_ID }}' -password='${{ secrets.WINDOWS_SIGNING_PASSWORD }}' -totp_secret='${{ secrets.WINDOWS_SIGNING_TOTP_SECRET }}' -output_dir_path="${env:GITHUB_WORKSPACE}/artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/rclip-*.msi
          if-no-files-found: error

  windows-test:
    needs: [parse_tag, windows-build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: Install MSI
        run: |
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i rclip-${{ needs.parse_tag.outputs.version }}.msi /quiet /norestart'
          if ($process.ExitCode -notin 0, 3010) { throw "msiexec failed with exit code $($process.ExitCode)" }
      - uses: ./.github/actions/test-system-rclip

  create_release:
    needs: [parse_tag, pypi-release, snap-release, appimage-test, windows-test]
    # the windows job doesn't run for pre-releases, but we need to create a release for pre-releases too
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # if any of the needs jobs fail, we don't want to create a release
      # this is needed because the condition above allows skipped dependencies
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Rename snaps for GitHub releases page
        run: |
          for snap in artifacts/snap-*/*.snap; do
            mv "$snap" "${snap//_/-}"
          done
      - name: Rename AppImage for GitHub releases page
        run: mv artifacts/appimage/rclip-${{ needs.parse_tag.outputs.version }}-x86_64.AppImage artifacts/appimage/rclip-${{ needs.parse_tag.outputs.version }}-amd64.AppImage
      - name: Get previous public release tag
        id: previous_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag=$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r '
                [
                  .[]
                  | select(.draft == false and .published_at != null and .tag_name != env.GITHUB_REF_NAME)
                ]
                | sort_by(.published_at)
                | if length == 0 then "" else .[-1].tag_name end
              '
          )
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous public release tag: ${previous_tag:-<none>}"
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          artifacts: artifacts/pypi/rclip-*,artifacts/snap-amd64/rclip-*.snap,artifacts/snap-arm64/rclip-*.snap,artifacts/appimage/rclip-*.AppImage,artifacts/windows/rclip-*.msi
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.previous_release.outputs.tag }}
          prerelease: ${{ needs.parse_tag.outputs.is_stable_version == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
