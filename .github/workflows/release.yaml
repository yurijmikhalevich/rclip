name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  # builds and tests every artifact without publishing anything
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign the Windows MSI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  parse_tag:
    runs-on: ubuntu-22.04
    outputs:
      is_stable_version: ${{ steps.parse.outputs.is_stable_version }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: parse
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          is_stable_version=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "the tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml, $version" >&2
              exit 1
            fi
            is_stable_version=$([[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo true || echo false)
          fi

          echo "is_stable_version=$is_stable_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Builds the binary for every platform. All the other jobs package and test these binaries.
  build:
    needs: parse_tag
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-syft
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3,cargo-auditable@0.7.7
      - uses: ./.github/actions/rust-build-setup
      # cargo-auditable records the crates compiled into the binary, which the SBOM is generated from
      - run: cargo auditable build --release --locked
      - run: release-utils/package.sh ${{ matrix.target }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: rclip-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The LibRaw sources are published with each release, before the binaries built from them.
  libraw-source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Archive the LibRaw sources
        run: |
          version=$(jq -r '.[] | select(.name == "LibRaw").version' compliance/native_components.json)
          mkdir source
          git -C vendor/libraw archive --format=tar.gz --prefix="LibRaw-$version/" -o "$PWD/source/LibRaw-$version-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: libraw-source
          path: source/*
          if-no-files-found: error

  wheel-test:
    needs: build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: rclip-${{ matrix.target }}
          path: dist/
      - run: pip install dist/rclip-*.whl
        shell: bash
      - uses: ./.github/actions/test-system-rclip
        # Authenticate Hugging Face Hub requests to avoid the anonymous per-IP rate limit, which is
        # shared with other GitHub-hosted runners and fails the tests with HTTP 429.
        env:
          HF_TOKEN: ${{ secrets.HF_READONLY_TOKEN }}

  pypi-release:
    needs: [parse_tag, create_release]
    # pre-releases stay off PyPI: every release there counts toward the project's storage quota
    if: ${{ !cancelled() && needs.create_release.result == 'success' && needs.parse_tag.outputs.is_stable_version == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rclip-*
          path: artifacts/
          merge-multiple: true
      - run: mkdir dist && mv artifacts/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  snap-build:
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: rclip-${{ matrix.target }}
          path: dist/
      - name: Lay out the files of the snap
        run: |
          mkdir -p snap-root/bin snap-root/share/doc/rclip
          tar xzf dist/rclip-*.tar.gz --strip-components=1 -C snap-root/share/doc/rclip
          mv snap-root/share/doc/rclip/rclip snap-root/bin/
      - uses: canonical/setup-lxd@main
      - run: sudo snap install snapcraft --classic
      - run: snapcraft --use-lxd --build-for ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: rclip_*.snap
          if-no-files-found: error

  snap-test:
    needs: snap-build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: snap-${{ matrix.arch }}
      - run: sudo snap install rclip_*_${{ matrix.arch }}.snap --dangerous
      - uses: ./.github/actions/test-system-rclip
        env:
          HF_TOKEN: ${{ secrets.HF_READONLY_TOKEN }}

  snap-release:
    needs: [parse_tag, create_release]
    # create_release runs for pre-releases although the windows jobs it needs are skipped, which
    # would skip this job too without the explicit condition
    if: ${{ !cancelled() && needs.create_release.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - run: sudo snap install snapcraft --classic
      - uses: actions/download-artifact@v8
        with:
          pattern: snap-*
          merge-multiple: true
      - name: Upload snaps to the beta channel
        run: |
          for snap in *.snap; do
            snapcraft upload --release=beta "$snap"
          done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
      - name: Promote snaps to the stable channel
        if: needs.parse_tag.outputs.is_stable_version == 'true'
        run: snapcraft promote --from-channel=beta --to-channel=stable --yes rclip
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}

  appimage-build:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: rclip-x86_64-unknown-linux-gnu
          path: dist/
      - name: Install appimagetool
        run: |
          sudo apt-get install -y fuse
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - run: release-utils/appimage/build_appimage.sh dist/rclip-*-x86_64-unknown-linux-gnu.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: rclip-*.AppImage
          if-no-files-found: error

  appimage-test:
    needs: appimage-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get install -y fuse
      - uses: actions/download-artifact@v8
        with:
          name: appimage
      - name: Install AppImage
        run: |
          chmod +x rclip-*.AppImage
          sudo mv rclip-*.AppImage /usr/local/bin/rclip
      - uses: ./.github/actions/test-system-rclip
        env:
          HF_TOKEN: ${{ secrets.HF_READONLY_TOKEN }}

  windows-build:
    needs: [parse_tag, build]
    # signing an MSI is paid for, so pre-releases don't get one
    if: >-
      (github.event_name == 'push' && needs.parse_tag.outputs.is_stable_version == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: rclip-x86_64-pc-windows-msvc
          path: dist/
      - name: Lay out the files of the installer
        shell: bash
        run: |
          mkdir dist/rclip
          tar xzf dist/rclip-*.tar.gz --strip-components=1 -C dist/rclip
      - name: Install Advinst
        uses: caphyon/advinst-github-action@main
        with:
          advinst-version: '23.5'
          advinst-enable-automation: 'true'
      - run: |
          & ./release-utils/windows/build-msi.ps1 "${{ needs.parse_tag.outputs.version }}"
          mv build-msi/rclip-SetupFiles/rclip.msi build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi
      - name: Stage unsigned MSI
        if: github.event_name == 'workflow_dispatch' && !inputs.sign_windows
        run: |
          mkdir artifacts
          mv build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi artifacts/
      - name: Sign MSI
        if: github.event_name == 'push' || inputs.sign_windows
        run: |
          mkdir artifacts
          Invoke-WebRequest -URI https://d1smxttentwwqu.cloudfront.net/wp-content/uploads/2023/11/CodeSignTool-v1.2.7-windows.zip -OutFile CodeSignTool.zip
          if ( ( Get-FileHash -Algorithm SHA256 CodeSignTool.zip ).Hash -ne 'AC9CDBFF6D482DBC1107ABC8789570F57ECF85773332BBA466CB3E00CE0BB841' ) { throw 'hash does not match' }
          Expand-Archive -Path CodeSignTool.zip -DestinationPath .
          cd CodeSignTool-v1.2.7-windows
          & ./CodeSignTool.bat sign -input_file_path="${env:GITHUB_WORKSPACE}/build-msi/rclip-SetupFiles/rclip-${{ needs.parse_tag.outputs.version }}.msi" -username=${{ secrets.ES_USERNAME }} -password="${{ secrets.ES_PASSWORD }}" -totp_secret="${{ secrets.ES_TOTP_SECRET }}" -output_dir_path="${env:GITHUB_WORKSPACE}/artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  windows-test:
    needs: [parse_tag, windows-build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: Install MSI
        run: |
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i rclip-${{ needs.parse_tag.outputs.version }}.msi /quiet /norestart'
          if ($process.ExitCode -notin 0, 3010) { throw "msiexec failed with exit code $($process.ExitCode)" }
      - uses: ./.github/actions/test-system-rclip
        env:
          HF_TOKEN: ${{ secrets.HF_READONLY_TOKEN }}

  create_release:
    needs: [parse_tag, libraw-source, wheel-test, snap-test, appimage-test, windows-test]
    # the windows job doesn't run for pre-releases, but we need to create a release for pre-releases too
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # if any of the needs jobs fail, we don't want to create a release
      # this is needed because the condition above allows skipped dependencies
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
      - name: Rename the snaps and the AppImage for the GitHub releases page
        run: |
          for snap in artifacts/*.snap; do
            mv "$snap" "${snap//_/-}"
          done
          mv artifacts/rclip-${{ needs.parse_tag.outputs.version }}-x86_64.AppImage artifacts/rclip-${{ needs.parse_tag.outputs.version }}-amd64.AppImage
      - name: Get previous public release tag
        id: previous_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag=$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r '
                [
                  .[]
                  | select(.draft == false and .published_at != null and .tag_name != env.GITHUB_REF_NAME)
                ]
                | sort_by(.published_at)
                | if length == 0 then "" else .[-1].tag_name end
              '
          )
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous public release tag: ${previous_tag:-<none>}"
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          artifacts: artifacts/*
          allowUpdates: true
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.previous_release.outputs.tag }}
          prerelease: ${{ needs.parse_tag.outputs.is_stable_version == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  brew:
    # the formula downloads the binaries from the GitHub release
    needs: [parse_tag, create_release]
    if: ${{ !cancelled() && needs.create_release.result == 'success' && needs.parse_tag.outputs.is_stable_version == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup git
        run: |
          git config --global user.email "zhibot.gh@gmail.com"
          git config --global user.name "Zhi Bot"
      - run: make release-brew
        env:
          GITHUB_TOKEN: ${{ secrets.ZHIBOT_GITHUB_TOKEN }}
