name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  test:
    strategy:
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-22.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Dependencies
        run: uv sync --locked
      - run: make test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install NASM for libjpeg-turbo's SIMD code
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install nasm --no-progress -y
            echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nasm
          fi
      - uses: ./.github/actions/onnxruntime
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      # The end-to-end tests download the model; caching it avoids Hugging Face's anonymous per-IP
      # rate limit, which is shared with other GitHub-hosted runners.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rclip-test-data
          key: rclip-test-data-${{ runner.os }}-${{ hashFiles('src/model/download.rs') }}
      - run: cargo test --release --locked --no-fail-fast
        env:
          RCLIP_TEST_DATADIR: ${{ runner.temp }}/rclip-test-data
      # ort's prebuilt ONNX Runtime needs AVX2, so check that the one built from source doesn't.
      - name: Index and search on an emulated x86-64-v1 CPU
        if: runner.os == 'Linux'
        shell: bash
        env:
          RCLIP_DATADIR: ${{ runner.temp }}/rclip-test-data
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user
          mkdir "$RUNNER_TEMP/old-cpu"
          cp tests/e2e/images/cat.jpg "tests/e2e/images/boats on a lake.png" tests/e2e/images/tree.webp "$RUNNER_TEMP/old-cpu"
          cd "$RUNNER_TEMP/old-cpu"
          qemu-x86_64 -cpu Opteron_G1 "$GITHUB_WORKSPACE/target/release/rclip" cat | tee /dev/stderr | sed -n 2p | grep -F cat.jpg

  kitty-copy:
    strategy:
      matrix:
        # Ubuntu 24.04 ships kitty 0.32, whose `kitten` has no `query_terminal`, while the official
        # tarball ships the Go kitten that has it, so both paths need coverage.
        kitty: [distro, tarball]
    runs-on: ubuntu-24.04
    env:
      KITTY_VERSION: 0.48.2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Kitty
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xclip xvfb
          if [ "${{ matrix.kitty }}" = tarball ]; then
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl fonts-dejavu-core libcairo2 libdbus-1-3 libegl1 libfontconfig1 \
              libgl1 libgl1-mesa-dri libharfbuzz0b liblcms2-2 libwayland-client0 libx11-6 \
              libxcursor1 libxkbcommon-x11-0 libxkbcommon0 xz-utils
            sudo mkdir -p /opt/kitty
            curl -fsSL "https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION-x86_64.txz" | sudo tar xJ -C /opt/kitty
            echo /opt/kitty/bin >> "$GITHUB_PATH"
          else
            sudo apt-get install -y --no-install-recommends kitty
          fi
      - name: Install Dependencies
        run: uv sync --locked
      - name: Run image copy e2e in Kitty
        # Kitty exits 0 no matter what the program it runs returns, so collect the status inside the window.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" kitty --config NONE -o confirm_os_window_close=0 \
            bash -c 'uv run --no-sync pytest tests/e2e/test_kitty_transfer.py > "$RUNNER_TEMP/kitty-copy.log" 2>&1; echo $? > "$RUNNER_TEMP/kitty-copy.status"'
          cat "$RUNNER_TEMP/kitty-copy.log"
          test "$(cat "$RUNNER_TEMP/kitty-copy.status")" = 0
