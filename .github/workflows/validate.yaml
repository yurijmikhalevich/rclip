name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  test:
    strategy:
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-22.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Dependencies
        run: uv sync --locked
      - run: make test

  diagnose-pagination:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked
      - name: Repeat the failing pagination case
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "Pagination attempt ${attempt}/30"
            uv run pytest 'tests/unit/test_tui.py::test_detail_navigation_loads_more_results[80-cat]' -q || exit 1
          done
