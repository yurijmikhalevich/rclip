name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  test:
    strategy:
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-22.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Dependencies
        run: uv sync --locked
      - run: make test

  kitty-copy:
    strategy:
      matrix:
        # Ubuntu 24.04 ships kitty 0.32, whose `kitten` has no `query_terminal`, while the official
        # tarball ships the Go kitten that has it, so both paths need coverage.
        kitty: [distro, tarball]
    runs-on: ubuntu-24.04
    env:
      KITTY_VERSION: 0.48.2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Kitty
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xclip xvfb
          if [ "${{ matrix.kitty }}" = tarball ]; then
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl fonts-dejavu-core libcairo2 libdbus-1-3 libegl1 libfontconfig1 \
              libgl1 libgl1-mesa-dri libharfbuzz0b liblcms2-2 libwayland-client0 libx11-6 \
              libxcursor1 libxkbcommon-x11-0 libxkbcommon0 xz-utils
            sudo mkdir -p /opt/kitty
            curl -fsSL "https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION-x86_64.txz" | sudo tar xJ -C /opt/kitty
            echo /opt/kitty/bin >> "$GITHUB_PATH"
          else
            sudo apt-get install -y --no-install-recommends kitty
          fi
      - name: Install Dependencies
        run: uv sync --locked
      - name: Run image copy e2e in Kitty
        # Kitty exits 0 no matter what the program it runs returns, so collect the status inside the window.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" kitty --config NONE -o confirm_os_window_close=0 \
            bash -c 'uv run --no-sync pytest tests/e2e/test_kitty_transfer.py > "$RUNNER_TEMP/kitty-copy.log" 2>&1; echo $? > "$RUNNER_TEMP/kitty-copy.status"'
          cat "$RUNNER_TEMP/kitty-copy.log"
          test "$(cat "$RUNNER_TEMP/kitty-copy.status")" = 0
