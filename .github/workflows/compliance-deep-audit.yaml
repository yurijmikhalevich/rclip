name: compliance policy checks and reports

on:
  pull_request:
    paths:
      - .github/actions/setup-syft/**
      - .github/workflows/compliance-deep-audit.yaml
      - .github/workflows/release.yaml
      - about.hbs
      - about.toml
      - Cargo.lock
      - compliance/**
      - release-utils/**
      - scripts/third_party_notices.sh
      - snap/**
      - .gitmodules
      - vendor/**
  schedule:
    - cron: '31 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-deep-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3
      - name: Check the dependency policy and generate the third-party notices
        run: scripts/third_party_notices.sh > THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: rust-third-party-notices
          path: THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ScanCode
        run: python -m pip install scancode-toolkit==32.5.0 'pluggy<1.7'
      - name: Collect the sources of the crates and of LibRaw
        run: |
          cargo vendor --locked dependencies > /dev/null
          cp -R vendor/libraw dependencies/libraw
      - name: Generate informational ScanCode licence report
        run: scancode --processes 4 --license --package --copyright --json-pp scancode-dependencies.json dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: scancode-dependencies
          path: scancode-dependencies.json
          if-no-files-found: error

  latest-release-artifacts:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ScanCode and extraction tools
        run: |
          python -m pip install scancode-toolkit==32.5.0 'pluggy<1.7'
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools
      - name: Download latest AppImage, MSI, and Snaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern '*.AppImage' --pattern '*.msi' --pattern '*.snap' --dir release-artifacts
      - name: Extract release artifacts
        run: |
          mkdir appimage-root msi-root
          chmod +x release-artifacts/*.AppImage
          cd appimage-root
          appimage_path=(../release-artifacts/*.AppImage)
          "${appimage_path[0]}" --appimage-extract >/dev/null
          cd ../msi-root
          7z x ../release-artifacts/*.msi >/dev/null
          cd ..
          unsquashfs -d snap-amd64-root release-artifacts/*-amd64.snap >/dev/null
          unsquashfs -d snap-arm64-root release-artifacts/*-arm64.snap >/dev/null
      - name: Generate informational release artifact ScanCode reports
        run: |
          scancode --license --package --copyright --json-pp scancode-appimage.json appimage-root/squashfs-root
          scancode --license --package --copyright --json-pp scancode-msi.json msi-root
          scancode --license --package --copyright --json-pp scancode-snap-amd64.json snap-amd64-root
          scancode --license --package --copyright --json-pp scancode-snap-arm64.json snap-arm64-root
      - uses: actions/upload-artifact@v7
        with:
          name: scancode-release-artifacts
          path: scancode-*.json
          if-no-files-found: error
